<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>

    <!-- Ambient Blue Halo -->
    <radialGradient id="halo" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0072ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="0"/>
    </radialGradient>

    <!-- Electric Neon Gradient for Title & Ring -->
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="30%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Linear Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Card Background -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 800; font-size: 76px; letter-spacing: -2px; fill: url(#text-grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 0.5px; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 500; font-size: 13px; fill: #cbd5e1; }
    .feat-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 500; font-size: 15px; fill: #e2e8f0; }
  </style>

  <!-- Deep Canvas -->
  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1198" height="478" x="1" y="1" rx="23" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Ambient Light Halos -->
  <circle cx="300" cy="240" r="260" fill="url(#halo)"/>

  <!-- Subtle grid pattern lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
    <line x1="1000" y1="0" x2="1000" y2="480"/>
  </g>

  <!-- Star accents -->
  <circle cx="140" cy="90" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="210" cy="380" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="510" cy="70" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="850" cy="80" r="1.5" fill="#38bdf8" opacity="0.5"/>
  <circle cx="1120" cy="340" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="1060" cy="110" r="1.5" fill="#7dd3fc" opacity="0.6"/>

  <!-- ================= LEFT: ORBIT LOGO (LARGE) ================= -->
  <g transform="translate(140, 90)">
    <!-- Tilted Ring System (-26 deg) -->
    <g transform="rotate(-26 150 150)">
      <!-- 1. Back Arc of Outer Ring -->
      <path
        d="M 35 150 A 115 42 0 0 1 265 150"
        fill="none"
        stroke="url(#neon-blue)"
        stroke-width="14"
        stroke-linecap="round"
        filter="url(#soft-glow)"
      />

      <!-- 2. Inner Satellite Track -->
      <path
        d="M 180 126 A 92 34 0 0 1 245 150"
        fill="none"
        stroke="url(#neon-blue)"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.85"
      />

      <!-- 3. Satellite Moon -->
      <circle cx="218" cy="133" r="8.5" fill="#ffffff"/>
      <circle cx="218" cy="133" r="11" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

      <!-- 4. Pure Black Planet Sphere -->
      <circle cx="150" cy="150" r="66" fill="#000000" stroke="#1e293b" stroke-width="2"/>

      <!-- 5. Front Arc of Outer Ring -->
      <path
        d="M 265 150 A 115 42 0 0 1 35 150"
        fill="none"
        stroke="url(#neon-blue)"
        stroke-width="14"
        stroke-linecap="round"
        filter="url(#soft-glow)"
      />
    </g>
  </g>

  <!-- ================= RIGHT: HERO CONTENT ================= -->
  <g transform="translate(520, 90)">
    <!-- Category Pill Badge -->
    <g>
      <rect width="185" height="30" rx="15" fill="#0c4a6e" fill-opacity="0.5" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#00e5ff"/>
      <text x="28" y="20" class="badge-text">POWERED BY GROQ</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="112" class="title">ORBIT</text>

    <!-- Subtitle -->
    <text x="0" y="152" class="subtitle">Next-gen AI chatbot for Windows &amp; Android</text>

    <!-- Feature Checklist -->
    <g transform="translate(0, 185)">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="7" fill="#0284c7" fill-opacity="0.3"/>
        <path d="M 5 8 L 7 10 L 11 6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="24" y="13" class="feat-text">Ultra-Fast Streaming (Groq)</text>
      </g>
      <g transform="translate(0, 32)">
        <circle cx="8" cy="8" r="7" fill="#0284c7" fill-opacity="0.3"/>
        <path d="M 5 8 L 7 10 L 11 6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="24" y="13" class="feat-text">ChatGPT-Style Dark &amp; Light UI</text>
      </g>

      <!-- Col 2 -->
      <g transform="translate(290, 0)">
        <circle cx="8" cy="8" r="7" fill="#0284c7" fill-opacity="0.3"/>
        <path d="M 5 8 L 7 10 L 11 6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="24" y="13" class="feat-text">Windows Desktop App (.exe)</text>
      </g>
      <g transform="translate(290, 32)">
        <circle cx="8" cy="8" r="7" fill="#0284c7" fill-opacity="0.3"/>
        <path d="M 5 8 L 7 10 L 11 6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="24" y="13" class="feat-text">Android Mobile App (.apk)</text>
      </g>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="80" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" class="pill-text">React 19</text>

      <rect x="90" y="0" width="80" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="105" y="18" class="pill-text">Tailwind</text>

      <rect x="180" y="0" width="75" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="195" y="18" class="pill-text">Electron</text>

      <rect x="265" y="0" width="85" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="277" y="18" class="pill-text">Capacitor</text>

      <rect x="360" y="0" width="85" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="375" y="18" class="pill-text">Groq API</text>
    </g>
  </g>
</svg>

