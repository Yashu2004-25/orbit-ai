<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Crisp Electric Blue Neon Gradient -->
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#00d2ff"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Subtle Soft Glow (Clean & Crisp, not dilated) -->
    <filter id="crisp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dark Icon Container Background -->
    <radialGradient id="icon-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Ambient Cosmic Halo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect width="256" height="256" rx="64" fill="url(#icon-bg)"/>

  <!-- Subtle Ambient Halo -->
  <circle cx="128" cy="128" r="95" fill="url(#halo)"/>

  <!-- Tilted Orbit System (-26 degrees) -->
  <g transform="rotate(-26 128 128)">
    <!-- 1. Back Arc of Outer Ring (Passes behind the sphere) -->
    <path
      d="M 32 128 A 96 35 0 0 1 224 128"
      fill="none"
      stroke="url(#neon-blue)"
      stroke-width="12"
      stroke-linecap="round"
      filter="url(#crisp-glow)"
    />

    <!-- 2. Inner Track (Where satellite orbits) -->
    <path
      d="M 152 108 A 78 28 0 0 1 206 128"
      fill="none"
      stroke="url(#neon-blue)"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- 3. Orbiting White Satellite Sphere -->
    <circle
      cx="184"
      cy="114"
      r="7"
      fill="#ffffff"
    />
    <circle
      cx="184"
      cy="114"
      r="9"
      fill="none"
      stroke="#38bdf8"
      stroke-width="1.5"
      opacity="0.6"
    />

    <!-- 4. Pure Black Planet / Singularity Core -->
    <circle
      cx="128"
      cy="128"
      r="54"
      fill="#000000"
      stroke="#1e293b"
      stroke-width="1.5"
    />

    <!-- 5. Front Arc of Outer Ring (Passes crisply in front of the sphere) -->
    <path
      d="M 224 128 A 96 35 0 0 1 32 128"
      fill="none"
      stroke="url(#neon-blue)"
      stroke-width="12"
      stroke-linecap="round"
      filter="url(#crisp-glow)"
    />
  </g>
</svg>
